name: Boards protected ref event matrix
on:
  create:
  push:
    branches:
      - 'release/**'
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record immutable event fields
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "triggering_actor=${{ github.triggering_actor }}"
