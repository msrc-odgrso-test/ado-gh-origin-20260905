name: boards-branch-origin-secret-proof
on:
  push:
    branches:
      - boards-low-prmerge-impact-20260905
permissions:
  contents: read
jobs:
  prove-origin-trust:
    runs-on: ubuntu-latest
    steps:
      - name: Hash the origin-only repository secret
        shell: bash
        env:
          PROOF_SECRET: ${{ secrets.BOARDS_BRANCH_PROOF }}
        run: |
          test -n "$PROOF_SECRET"
          printf 'BOARDS_SECRET_SHA256='
          printf '%s' "$PROOF_SECRET" | sha256sum | cut -d' ' -f1
          printf 'BOARDS_BRANCH=%s\n' "$GITHUB_REF_NAME"