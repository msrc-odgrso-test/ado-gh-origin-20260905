trigger:
  branches:
    include:
      - release/*
pr: none
pool:
  vmImage: ubuntu-latest
stages:
  - stage: ProtectedRelease
    displayName: Protected release deployment
    jobs:
      - deployment: UseProtectedConnection
        displayName: Use administrator-authorized service connection
        environment:
          name: MSRC-Triager-Replay-20260905124929
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: false
                - bash: |
                    set -euo pipefail
                    printf 'reason=%s\n' "$(Build.Reason)"
                    printf 'source_branch=%s\n' "$(Build.SourceBranch)"
                    printf 'source_version=%s\n' "$(Build.SourceVersion)"
                  displayName: Record immutable run identity
                - task: AzureCLI@2
                  displayName: Attacker YAML marker 20260905125218
                  inputs:
                    azureSubscription: SC-SelfApproval-WIF-20260905
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      resource_id="/subscriptions/$(az account show --query id --output tsv)/resourceGroups/rg-msrc-gh-approval-20260905"
                      canary="boards-release-build-$(Build.BuildId)-$(Build.SourceVersion)"
                      az tag update --resource-id "$resource_id" --operation Merge --tags boards_attacker_yaml_canary_20260905125218="$canary" --output none
                      observed="$(az tag list --resource-id "$resource_id" --query 'properties.tags.boards_attacker_yaml_canary_20260905125218' --output tsv)"
                      test "$observed" = "$canary"
                      printf 'boards_attacker_yaml_canary_20260905125218=%s\n' "$observed"
