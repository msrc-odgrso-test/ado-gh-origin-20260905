trigger: none
pr: none
resources:
  repositories:
  - repository: privateB
    type: github
    endpoint: GH-PAT-NO-LOW-20260905
    name: msrc-odgrso-test/ado-gh-private-scope-20260905
    ref: refs/heads/main
pool:
  vmImage: ubuntu-latest
jobs:
- job: SelfThenPrivate
  steps:
  - checkout: self
    path: s/self
    persistCredentials: true
  - checkout: privateB
    path: s/private
    persistCredentials: true
  - bash: |
      set -euo pipefail
      SELF_COUNT=$( { git -C "$(Pipeline.Workspace)/s/self" config --local --get-regexp '^http\..*\.extraheader$' | wc -l | tr -d ' ')
      PRIVATE_COUNT=$( { git -C "$(Pipeline.Workspace)/s/private" config --local --get-regexp '^http\..*\.extraheader$' | wc -l | tr -d ' ')
      GLOBAL_COUNT=$( { git config --global --get-regexp '^http\..*\.extraheader$' 2>/dev/null || true; } | wc -l | tr -d ' ')
      echo "ORDER=self-private SELF_LOCAL=$SELF_COUNT PRIVATE_LOCAL=$PRIVATE_COUNT GLOBAL=$GLOBAL_COUNT"
    displayName: Check repository-local credential placement
- job: PrivateThenSelf
  steps:
  - checkout: privateB
    path: s/private
    persistCredentials: true
  - checkout: self
    path: s/self
    persistCredentials: true
  - bash: |
      set -euo pipefail
      SELF_COUNT=$( { git -C "$(Pipeline.Workspace)/s/self" config --local --get-regexp '^http\..*\.extraheader$' | wc -l | tr -d ' ')
      PRIVATE_COUNT=$( { git -C "$(Pipeline.Workspace)/s/private" config --local --get-regexp '^http\..*\.extraheader$' | wc -l | tr -d ' ')
      GLOBAL_COUNT=$( { git config --global --get-regexp '^http\..*\.extraheader$' 2>/dev/null || true; } | wc -l | tr -d ' ')
      echo "ORDER=private-self SELF_LOCAL=$SELF_COUNT PRIVATE_LOCAL=$PRIVATE_COUNT GLOBAL=$GLOBAL_COUNT"
    displayName: Check reverse checkout order