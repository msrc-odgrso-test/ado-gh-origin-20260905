trigger: none
pr: none
resources:
  repositories:
  - repository: privateB
    type: github
    endpoint: GH-PAT-NO-LOW-20260905
    name: msrc-odgrso-test/ado-gh-private-scope-20260905
    ref: refs/heads/main
pool:
  vmImage: ubuntu-latest
jobs:
- job: SelfThenPrivate
  steps:
  - checkout: self
    path: s/self
    persistCredentials: true
  - checkout: privateB
    path: s/private
    persistCredentials: true
  - bash: |
      set -euo pipefail
      SELF_COUNT=$(git -C "$(Pipeline.Workspace)/s/self" config --local --name-only --get-regexp '^http\..*\.extraheader$' | awk 'NF {n++} END {print n+0}')
      PRIVATE_COUNT=$(git -C "$(Pipeline.Workspace)/s/private" config --local --name-only --get-regexp '^http\..*\.extraheader$' | awk 'NF {n++} END {print n+0}')
      GLOBAL_COUNT=$(git config --global --name-only --get-regexp '^http\..*\.extraheader$' 2>/dev/null | awk 'NF {n++} END {print n+0}' || true)
      echo "ORDER=self-private SELF_LOCAL=$SELF_COUNT PRIVATE_LOCAL=$PRIVATE_COUNT GLOBAL=$GLOBAL_COUNT"
      test "$SELF_COUNT" = 1
      test "$PRIVATE_COUNT" = 1
      test "$GLOBAL_COUNT" = 0
    displayName: Check repository-local credential placement
- job: PrivateThenSelf
  steps:
  - checkout: privateB
    path: s/private
    persistCredentials: true
  - checkout: self
    path: s/self
    persistCredentials: true
  - bash: |
      set -euo pipefail
      SELF_COUNT=$(git -C "$(Pipeline.Workspace)/s/self" config --local --name-only --get-regexp '^http\..*\.extraheader$' | awk 'NF {n++} END {print n+0}')
      PRIVATE_COUNT=$(git -C "$(Pipeline.Workspace)/s/private" config --local --name-only --get-regexp '^http\..*\.extraheader$' | awk 'NF {n++} END {print n+0}')
      GLOBAL_COUNT=$(git config --global --name-only --get-regexp '^http\..*\.extraheader$' 2>/dev/null | awk 'NF {n++} END {print n+0}' || true)
      echo "ORDER=private-self SELF_LOCAL=$SELF_COUNT PRIVATE_LOCAL=$PRIVATE_COUNT GLOBAL=$GLOBAL_COUNT"
      test "$SELF_COUNT" = 1
      test "$PRIVATE_COUNT" = 1
      test "$GLOBAL_COUNT" = 0
    displayName: Check reverse checkout order
