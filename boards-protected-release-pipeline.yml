trigger:
  branches:
    include:
      - release/*

pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ProtectedRelease
    displayName: Protected release deployment
    jobs:
      - deployment: UseProtectedConnection
        displayName: Use administrator-authorized service connection
        environment: MSRC-BranchControl-20260905
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: false
                - bash: |
                    set -euo pipefail
                    printf 'reason=%s\n' "$(Build.Reason)"
                    printf 'source_branch=%s\n' "$(Build.SourceBranch)"
                    printf 'source_version=%s\n' "$(Build.SourceVersion)"
                  displayName: Record immutable run identity
                - task: AzureCLI@2
                  displayName: Write fixed release canary
                  inputs:
                    azureSubscription: SC-SelfApproval-WIF-20260905
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      resource_id="/subscriptions/$(az account show --query id --output tsv)/resourceGroups/rg-msrc-gh-approval-20260905"
                      canary="boards-release-build-$(Build.BuildId)-$(Build.SourceVersion)"
                      az tag update --resource-id "$resource_id" --operation Merge --tags boards_release_pipeline_canary="$canary" --output none
                      observed="$(az tag list --resource-id "$resource_id" --query 'properties.tags.boards_release_pipeline_canary' --output tsv)"
                      test "$observed" = "$canary"
                      printf 'boards_release_pipeline_canary=%s\n' "$observed"
